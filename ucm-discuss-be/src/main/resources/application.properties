spring.application.name=ucm-discuss-be

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.datasource.url=jdbc:mariadb://localhost:3306/ucmplayground
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# logging
logging.file.name=logs/app.log
logging.file.path=logs

# Oauth2 Credentials
spring.security.oauth2.client.registration.google.client-id={client-idhere}
spring.security.oauth2.client.registration.google.client-secret={client-secrethere}

# JWT key
security.jwt.secret-key=your-secret-key
security.jwt.expiration-time=3600000